name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Astro needs Node 22.23.4 or newer
          node-version: 24
          check-latest: true
          cache: npm

      - run: node --version
      - run: npm ci
      - run: npm run build

      - name: Upload site over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Folder on Hostinger that serves www.padmanabhan.in.
          # Set the repo variable FTP_SERVER_DIR if yours differs.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
